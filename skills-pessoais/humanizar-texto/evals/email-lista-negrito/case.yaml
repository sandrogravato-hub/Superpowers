schema_version: "1.1"
name: email-lista-negrito
expected_outcome: |
  O email reescrito passa a lista com rótulos a negrito para prosa ou marcadores simples, corta a cortesia de abertura, a fórmula 'não se trata de… é…' e a exortação final, e mantém todas as datas, horas, sala, prazo, valor e assinatura.
